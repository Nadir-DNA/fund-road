services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fundroad
      POSTGRES_USER: fundroad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    ports:
      - '127.0.0.1:5448:5432'
    volumes:
      - fundroad_db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fundroad']
      interval: 5s
      retries: 10
volumes:
  fundroad_db:
