# Vérification à chaque push et pull request : compilation, tests unitaires, build de l'interface
name: CI

on:
  push:
    branches: [main, "refonte/**"]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
